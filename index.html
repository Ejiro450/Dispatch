<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063A80">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EAM">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>EAM Global Movers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: summary strip and week on top, then one horizontal lane per truck against a shared time axis. */
:root{
  --bg:#f3f6fb; --panel:#ffffff; --ink:#1d2430; --muted:#5d6878; --line:#d9e1ec; --grid:#e8edf5;
  --navy:#063A80; --royal:#004AAD; --sky:#38B6FF; --accent-ink:#ffffff;
  --job:#e6f0ff; --job-line:#004AAD; --job-ink:#062a5e;
  --warn:#b45309; --warn-bg:#fff4dd; --bad:#c62828; --bad-bg:#fde8e8; --ok:#1b7f4c; --ok-bg:#e3f5ea;
  --display:"Montserrat","Manrope",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1320; --panel:#141d2d; --ink:#e8eef8; --muted:#9aa8bd; --line:#2a364a; --grid:#1e293b;
    --navy:#0a2f66; --royal:#5aa2ff; --sky:#38B6FF; --accent-ink:#06162e;
    --job:#17305a; --job-line:#5aa2ff; --job-ink:#dbe9ff;
    --warn:#f3b24a; --warn-bg:#3a2a0c; --bad:#ff8a80; --bad-bg:#3d1616; --ok:#6ed39b; --ok-bg:#12301f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1320; --panel:#141d2d; --ink:#e8eef8; --muted:#9aa8bd; --line:#2a364a; --grid:#1e293b;
  --navy:#0a2f66; --royal:#5aa2ff; --sky:#38B6FF; --accent-ink:#06162e;
  --job:#17305a; --job-line:#5aa2ff; --job-ink:#dbe9ff;
  --warn:#f3b24a; --warn-bg:#3a2a0c; --bad:#ff8a80; --bad-bg:#3d1616; --ok:#6ed39b; --ok-bg:#12301f;
  color-scheme:dark;
}
html{--sat:env(safe-area-inset-top,0px)}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--spark:#9aa6b8;--trk:#cde2fb;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#256abf;--q6:#104281}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--spark:#5d6b80;--trk:#184f95;--q1:#123a6e;--q2:#184f95;--q3:#256abf;--q4:#3987e5;--q5:#6da7ec;--q6:#9ec5f4}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--spark:#5d6b80;--trk:#184f95;--q1:#123a6e;--q2:#184f95;--q3:#256abf;--q4:#3987e5;--q5:#6da7ec;--q6:#9ec5f4}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.4;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sky);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:16px;padding-top:calc(16px + var(--sat));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));padding-left:calc(16px + env(safe-area-inset-left,0px));padding-right:calc(16px + env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.gate{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:28px 22px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;max-width:560px}
.gate h2{font-family:var(--display);margin:0;font-size:20px}
.gate p{margin:0;color:var(--muted)}
.gate code{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:13px;overflow-wrap:anywhere}
body.gated .daybar,body.gated .week,body.gated .stats,body.gated .board,body.gated .legend,body.gated #btnSheet,body.gated #btnFleet{display:none}
body:not(.gated) #gate{display:none}
body.gated .tabs,body.gated #qframe{display:none}
.tabs{display:flex;gap:4px;background:rgba(255,255,255,.12);border-radius:10px;padding:3px}
.tabs button{border:0;background:transparent;color:#fff;font-weight:700;padding:7px 14px;border-radius:8px}
.tabs button[aria-current="page"]{background:#fff;color:#063A80}
#qframe{width:100%;border:1px solid var(--line);border-radius:14px;background:#fff;height:calc(100dvh - 120px - var(--sat) - env(safe-area-inset-bottom,0px));min-height:480px;display:block}
body:not(.quotes) #qframe{display:none}
body:not(.numbers) #numbers{display:none}
body.gated #numbers{display:none}
body.numbers .daybar,body.numbers .week,body.numbers .stats,body.numbers .board,body.numbers .legend,body.numbers #btnSheet{display:none}
#numbers{display:flex;flex-direction:column;gap:14px}
.nbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nbar h2{font-family:var(--display);font-size:22px;margin:0 8px 0 0}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--panel);padding:6px 12px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--royal);color:var(--accent-ink)}
#numbers .nbar .sp{flex:1}
#numbers .note{margin:0;font-size:12px;color:var(--muted);max-width:90ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 13px 8px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi.hero{grid-column:span 2}
.kpi .l{font-size:12px;font-weight:700;color:var(--muted)}
.kpi .v{font-family:var(--body);font-weight:800;font-size:26px;line-height:1.15;font-variant-numeric:normal;overflow-wrap:anywhere}
.kpi.hero .v{font-size:48px}
.kpi .d{font-size:12px;font-weight:700}
.kpi .d.g{color:var(--ok)} .kpi .d.b{color:var(--bad)} .kpi .d.n{color:var(--muted)}
.kpi .nt{font-size:12px;color:var(--muted)}
.kpi .spark{width:100%;height:26px;margin-top:4px;display:block}
.npanel.wide{grid-column:1/-1}
.npanel .sub{margin:-4px 0 8px;font-size:12.5px;color:var(--muted)}
.npanel details{margin-top:8px;font-size:13px} .npanel summary{cursor:pointer;color:var(--royal);font-weight:700}
.tw{overflow-x:auto;margin-top:6px}
.npanel table td.r,.npanel table th.r{font-variant-numeric:tabular-nums}
.miss{color:var(--warn);font-size:11px;font-weight:700}
.chart{width:100%;min-height:40px}
.chart svg{display:block;overflow:visible}
.chart .ax{font-size:11px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .ax.cur{fill:var(--ink);font-weight:700}
.chart .lb{font-size:12.5px;fill:var(--ink)} .chart .vl{font-size:12px;fill:var(--muted);font-variant-numeric:tabular-nums}
.chart .gl{stroke:var(--grid);stroke-width:1} .chart .bl{stroke:var(--line);stroke-width:1}
.chart .hit{fill:transparent;cursor:default} .chart .hit:hover{fill:var(--ink);fill-opacity:.05}
.chart .cell:hover{stroke:var(--ink);stroke-width:1.5}
.lgd{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin:0 0 6px}
.lgd i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.scale{display:flex;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:6px} .scale i{width:18px;height:10px;border-radius:2px;display:inline-block} .scale span{margin:0 4px}
.mrow{display:flex;flex-direction:column;gap:5px;margin:0 0 10px}
.mt{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px} .mt span{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--trk);overflow:hidden} .meter i{display:block;height:100%;border-radius:4px}
.ins{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ins li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45}
.ins .ic{flex:none;width:20px;height:20px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;background:var(--grid);color:var(--muted)}
.ins li.g .ic{background:var(--ok-bg);color:var(--ok)} .ins li.b .ic{background:var(--warn-bg);color:var(--warn)}
.dq{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.dq li{display:flex;gap:10px;align-items:baseline;font-size:13.5px} .dq b{min-width:64px;font-size:16px} .dq li.w b{color:var(--warn)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12.5px;line-height:1.45;padding:8px 10px;border-radius:8px;white-space:pre-line;max-width:280px;box-shadow:0 6px 18px rgba(0,0,0,.22);display:none}
.lockbox{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;display:flex;flex-direction:column;gap:10px}
.lockbox h2{font-family:var(--display);font-size:19px;margin:0} .lockbox p{margin:0;color:var(--muted)}
.lockbox form,.lockform{display:flex;flex-direction:column;gap:8px}
.lockbox input,.lockform input{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;width:100%;font-size:16px}
.lockbox .lbl,.lockform .lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.lmsg{margin:0;min-height:1.2em;font-weight:700;color:var(--bad)}
@media (max-width:760px){.kpi.hero{grid-column:1/-1}.kpi.hero .v{font-size:40px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi .v{font-size:21px}}
.ngrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.ngrid .stat small{display:block;font-size:11px;color:var(--muted);margin-top:2px}
.npanels{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(460px,100%),1fr));gap:12px;align-items:start}
.npanel td:first-child{white-space:nowrap}
.npanel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;overflow-x:auto}
.npanel h3{margin:0 0 8px;font-family:var(--display);font-size:15px}
.npanel table{width:100%;border-collapse:collapse;font-size:13px}
.npanel th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;padding:4px 8px 6px 0;border-bottom:1px solid var(--line);white-space:nowrap}
.npanel td{padding:6px 8px 6px 0;border-bottom:1px solid var(--grid);vertical-align:top}
.npanel th.r,.npanel td.r{text-align:right;padding-right:0;padding-left:8px;white-space:nowrap}
.npanel tr:last-child td{border-bottom:0}
.npanel .none{color:var(--muted);font-size:13px}
.flag.ok{background:var(--ok-bg);color:var(--ok)}
.tin{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.tin input{width:auto!important}
/* Quotes fills the whole screen: slim bar on top, the Quote Builder underneath, edge to edge */
html,body{height:100%}
body.quotes{overflow:hidden;background:var(--navy)}
body.quotes .wrap{max-width:none;height:100vh;height:100dvh;gap:0;padding:var(--sat) 0 0 0}
body.quotes header.top{border-radius:0;padding:8px calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));gap:8px;flex:none}
body.quotes header.top>div:first-child{display:none}
body.quotes #qframe{flex:1 1 auto;height:auto;min-height:0;width:1px;min-width:100%;border:0;border-radius:0}
body.quotes #gate,body.quotes #overlay{display:none}
body.quotes .daybar,body.quotes .week,body.quotes #notices,body.quotes .stats,body.quotes .board,body.quotes .legend,body.quotes #btnSheet,body.quotes #btnFleet,body.quotes header.top .sub{display:none}
.who{font-size:12px;opacity:.85;overflow-wrap:anywhere}
.scrim .drawer{padding-top:calc(18px + var(--sat));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}

header.top{background:var(--navy);color:#fff;border-radius:14px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
header.top h1{font-family:var(--display);font-size:20px;margin:0;letter-spacing:.2px}
header.top .sub{font-size:12px;opacity:.8}
header.top .sp{flex:1}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:9px;padding:7px 12px;font-weight:600}
.btn:hover{border-color:var(--royal)}
.btn.primary{background:var(--royal);border-color:var(--royal);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:rgba(255,255,255,.35);color:#fff}
.btn.ghost:hover{border-color:#fff}
.btn.small{padding:4px 9px;font-size:12px}
.btn:disabled{opacity:.5;cursor:default}

.daybar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.daybar h2{font-family:var(--display);font-size:22px;margin:0 6px 0 0}
.fresh{font-size:12px;color:var(--muted)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wd{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;min-width:0}
.wd .d{font-weight:700;font-size:13px;display:flex;justify-content:space-between;gap:6px}
.wd .n{font-size:12px;color:var(--muted)}
.wd .bar{height:5px;border-radius:3px;background:var(--grid);overflow:hidden}
.wd .bar i{display:block;height:100%;background:var(--royal);border-radius:3px}
.wd.on{border-color:var(--royal);box-shadow:inset 0 0 0 1px var(--royal)}
.wd.today .d span:first-child::after{content:" today";font-weight:600;color:var(--royal);font-size:11px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--warn);flex:none;margin-top:5px}

.stats{display:flex;flex-wrap:wrap;gap:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 14px;min-width:112px}
.stat b{display:block;font-family:var(--display);font-size:22px;line-height:1.15}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn{background:var(--warn-bg);border-color:var(--warn)} .stat.warn b{color:var(--warn)}
.stat.bad{background:var(--bad-bg);border-color:var(--bad)} .stat.bad b{color:var(--bad)}
.stat.ok b{color:var(--ok)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:8px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1;min-width:280px}
.slot label{font-size:12px;color:var(--muted);font-weight:600}
.slot select,.slot input{border:1px solid var(--line);background:var(--bg);border-radius:7px;padding:4px 6px}
.slot input{width:58px}
.slot .ans{font-weight:600;flex-basis:100%}

.notice{border-radius:11px;padding:10px 14px;border:1px solid var(--line);background:var(--panel);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.notice.warn{background:var(--warn-bg);border-color:var(--warn)}
.notice.bad{background:var(--bad-bg);border-color:var(--bad)}
.notice p{margin:0;flex:1;min-width:220px}

.board{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
.grid{min-width:980px}
.row{display:grid;grid-template-columns:168px 1fr;border-top:1px solid var(--line)}
.row.head{border-top:0;background:var(--panel)}
.lab{padding:10px 12px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.lab .nm{font-weight:800;font-size:14px;overflow-wrap:anywhere}
.lab .meta{font-size:12px;color:var(--muted)}
.lab .crew{font-size:12px;overflow-wrap:anywhere}
.row.un .lab{background:var(--warn-bg)} .row.un .lab .nm{color:var(--warn)}
.row.un.empty .lab{background:transparent} .row.un.empty .lab .nm{color:var(--ok)}
.axis{position:relative;height:30px}
.axis span{position:absolute;top:8px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.lane{position:relative;min-height:74px;background-image:linear-gradient(to right,var(--grid) 1px,transparent 1px);background-size:var(--hour) 100%}
.lane.over{background-color:var(--job)}
.now{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);z-index:3;pointer-events:none}
.job{position:absolute;height:60px;border-radius:8px;background:var(--job);border:1px solid var(--job-line);border-left-width:5px;color:var(--job-ink);padding:5px 7px;text-align:left;overflow:hidden;display:flex;flex-direction:column;gap:1px;min-width:0;z-index:2}
.job:hover,.job.sel{box-shadow:0 0 0 2px var(--sky);z-index:4}
.job .t{font-weight:800;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .r{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.job .c{display:flex;gap:4px;flex-wrap:nowrap;overflow:hidden}
.chip{font-size:10px;font-weight:700;border-radius:5px;padding:0 5px;background:var(--panel);border:1px solid var(--job-line);white-space:nowrap}
.job.pending{border-style:dashed;border-left-style:solid}
.job.un{background:var(--warn-bg);border-color:var(--warn);color:var(--ink)} .job.un .chip{border-color:var(--warn)}
.job.clash{background:var(--bad-bg);border-color:var(--bad);color:var(--ink)} .job.clash .chip{border-color:var(--bad)}
.job.sub{background:var(--grid);border-color:var(--muted);color:var(--ink)} .job.sub .chip{border-color:var(--muted)}
.row.subrow .lab .nm{color:var(--muted)}
.legend i.s{background:var(--grid);border-color:var(--muted)}
.job.tight{border-left-color:var(--warn)}
.chip.w{background:var(--warn-bg);border-color:var(--warn);color:var(--warn)}
.chip.b{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.empty{padding:26px 16px;color:var(--muted);text-align:center}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12px;color:var(--muted);padding:2px 4px}
.legend i{display:inline-block;width:14px;height:10px;border-radius:3px;border:1px solid var(--job-line);background:var(--job);margin-right:5px;vertical-align:-1px}
.legend i.u{background:var(--warn-bg);border-color:var(--warn)} .legend i.x{background:var(--bad-bg);border-color:var(--bad)} .legend i.p{border-style:dashed}

.scrim{position:fixed;inset:0;background:rgba(6,20,45,.45);z-index:20;display:flex;justify-content:flex-end}
.scrim.mid{justify-content:center;align-items:center;padding:16px;padding-top:calc(16px + var(--sat))}
.drawer{background:var(--panel);width:min(430px,100%);height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px;border-left:1px solid var(--line)}
.modal{background:var(--panel);width:min(640px,100%);max-height:100%;overflow:auto;padding:18px;border-radius:14px;display:flex;flex-direction:column;gap:12px;border:1px solid var(--line)}
.drawer h3,.modal h3{font-family:var(--display);margin:0;font-size:18px;overflow-wrap:anywhere}
.hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.kv{display:grid;grid-template-columns:92px 1fr;gap:6px 10px;font-size:13px}
.kv dt{color:var(--muted);font-weight:600} .kv dd{margin:0;overflow-wrap:anywhere}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>label,.fld>.lbl{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.fld select,.fld input[type=text],.fld input[type=number],.fld input[type=time],textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 9px;width:100%}
.crewpick{display:flex;flex-wrap:wrap;gap:6px}
.crewpick label{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;display:flex;gap:6px;align-items:center;cursor:pointer}
.crewpick label.busy{border-color:var(--bad);color:var(--bad)}
.flags{display:flex;flex-direction:column;gap:6px}
.flag{border-radius:8px;padding:7px 10px;font-size:13px;font-weight:600}
.flag.b{background:var(--bad-bg);color:var(--bad)} .flag.w{background:var(--warn-bg);color:var(--warn)}
.rowi{display:grid;grid-template-columns:1fr 110px auto;gap:6px;align-items:center}
.rowi.one{grid-template-columns:1fr auto}
.acts{display:flex;flex-wrap:wrap;gap:8px}

<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1 id="appTitle">EAM Dispatch Board</h1>

    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"><button type="button" id="tabDispatch" aria-current="page">Dispatch</button><button type="button" id="tabQuotes">Quotes</button><button type="button" id="tabNumbers">Numbers</button></nav>
    <div class="sp"></div>
    <span class="who" id="who"></span>
    <button class="btn ghost" id="btnSheet" type="button">Copy run sheet</button>
    <button class="btn ghost" id="btnFleet" type="button">Trucks and crew</button>
    <button class="btn ghost" id="btnOut" type="button" hidden>Sign out</button>
  </header>

  <div class="gate" id="gate"></div>
  <iframe id="qframe" title="Quote Builder"></iframe>
  <div class="daybar">
    <h2 id="dayTitle">Loading</h2>
    <button class="btn small" id="prev" type="button" aria-label="Previous day">&larr; Prev</button>
    <button class="btn small" id="today" type="button">Today</button>
    <button class="btn small" id="next" type="button" aria-label="Next day">Next &rarr;</button>

  </div>

  <div class="week" id="week"></div>
  <div id="notices"></div>
  <section id="numbers" aria-label="Numbers"></section>
  <div class="stats" id="stats"></div>
  <div class="board"><div class="grid" id="grid"><div class="empty">Loading the calendar&hellip;</div></div></div>
  <div class="legend">
    <span><i></i>Assigned</span><span><i class="u"></i>Needs a truck</span><span><i class="s"></i>Subcontracted</span><span><i class="x"></i>Clash</span><span><i class="p"></i>Pending booking</span>
    <span>Drag a job onto a truck, or click it to assign truck and crew.</span>
  </div>
</div>
<div id="overlay"></div>

<script src="config.js"></script>
<script src="msal-browser.min.js"></script>
<script>
(function(){
"use strict";
var TZ="Australia/Melbourne";
var SIZES=["","Van","4.5T","8T","10T","12T","Other"];
var S={day:null,week:null,events:{},fetched:{},loading:false,err:null,assign:{},fleet:{trucks:[],crew:[],buffer:30},
  busy:{},sel:null,modal:null,auth:"wait",who:"",fleetLoaded:false,slotT:480,slotH:3};
var writeChain={},pending={};
var NARROW=window.matchMedia?window.matchMedia("(max-width:760px)"):{matches:false};

/* ---------- dates ---------- */
function pad(n){return (n<10?"0":"")+n}
function melParts(d){var p={};new Intl.DateTimeFormat("en-CA",{timeZone:TZ,year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"}).formatToParts(d).forEach(function(x){p[x.type]=x.value});return {date:p.year+"-"+p.month+"-"+p.day,min:(+p.hour)*60+(+p.minute)}}
function addDays(s,n){var d=new Date(s+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)}
function dow(s){return new Date(s+"T00:00:00Z").getUTCDay()}
function weekStart(s){var w=dow(s);return addDays(s,-((w+6)%7))}
function dayDiff(a,b){return Math.round((new Date(b+"T00:00:00Z")-new Date(a+"T00:00:00Z"))/864e5)}
var DN=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"],MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"],DL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function dShort(s){return DN[dow(s)]+" "+(+s.slice(8))}
function dLong(s){return DL[dow(s)]+" "+(+s.slice(8))+" "+MN[+s.slice(5,7)-1]}
function tm(m){m=((m%1440)+1440)%1440;var h=Math.floor(m/60),mi=m%60,ap=h<12?"am":"pm",hh=h%12||12;return hh+(mi?":"+pad(mi):"")+ap}
function hrs(n){return (Math.round(n*10)/10)+" hr"+(n===1?"":"s")}

/* ---------- parsing the team's calendar entries ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function tc(s){return String(s||"").toLowerCase().replace(/(^|[\s\/(-])([a-z])/g,function(m,a,b){return a+b.toUpperCase()}).trim()}
var PLAT=[["Airtasker",/air\s?ta\w*ker/i],["Facebook",/facebook|\bfb\b/i],["Hipages",/hi\s?pages/i],["Find a mover",/find\s?a\s?mover/i],["Referral",/referral/i],["Direct",/direct/i],["Website",/website/i],["Google",/google/i]];
var STREET=/\b(road|rd|street|st|drive|dr|avenue|ave|av|court|crt|ct|way|cct|circuit|crescent|cres|boulevard|blvd|lane|ln|place|pl|parade|pde|highway|hwy|close|cl|terrace|tce|grove|gr)\b\.?/ig;
function shortLoc(a){
  if(!a)return "";
  var ps=a.split(" + "),pick=ps[0];for(var q=0;q<ps.length;q++){STREET.lastIndex=0;if(/\d/.test(ps[q])&&STREET.test(ps[q])){pick=ps[q];break}}
  var s=pick.replace(/\(.*$/,"").replace(/\b(vic|victoria|nsw|qld|sa)\b\.?/ig,"").replace(/\d{4}\b/g,"").replace(/[.,\s]+$/,"").trim();
  var parts=s.split(",").map(function(x){return x.trim()}).filter(Boolean);
  if(parts.length>1&&!/\d/.test(parts[parts.length-1]))return tc(parts[parts.length-1]);
  var last=null,m;STREET.lastIndex=0;while((m=STREET.exec(s)))last=m;
  if(last){var rest=s.slice(last.index+last[0].length).replace(/^[.,\s]+/,"");if(rest)return tc(rest)}
  var w=s.split(/\s+/);return tc(w.slice(-1)[0]||"");
}
function parseBody(txt){
  var o={hours:null,fixed:false,pay:"",rate:"",type:"",pickup:"",drop:"",phone:""};
  var lines=String(txt||"").split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var mode=null,pk=[],dr=[],pre=[];
  lines.forEach(function(l){
    var m;
    if(/^pick\s?-?\s?up|^1st stop/i.test(l)){mode="p";var r=l.replace(/^pick\s?-?\s?up(\s+address(es)?)?(\s+is)?\s*:?\s*/i,"");if(r&&r!==l||/^1st/i.test(l)){if(r)pk.push(r)}else pk.push("");return}
    if(/^drop\s?-?\s?of/i.test(l)){mode="d";var r2=l.replace(/^drop\s?-?\s?off?(\s+address\w*)?(\s+is)?(\s+to)?\s*:?\s*/i,"");if(r2)dr.push(r2);return}
    if(/^(contact|phone)/i.test(l)){mode="c";return}
    if(mode==="p"){if(pk.length&&pk[pk.length-1]==="")pk[pk.length-1]=l;else pk.push(l);return}
    if(mode==="d"){dr.push(l);return}
    if(mode==="c")return;
    if((m=l.match(/initial\s+([\d.]+)\s*hours?/i))){o.hours=parseFloat(m[1]);return}
    if(/fixed\s+quote/i.test(l)){o.fixed=true;return}
    if(/per\s+hour/i.test(l)){var n=l.match(/(\d+(?:\.\d+)?)/);if(n)o.rate="$"+n[1]+"/hr";if(/collect/i.test(l)&&!o.pay)o.pay=l;return}
    if(/collect|e\s?-?account|paid in full/i.test(l)){o.pay=o.pay?o.pay+" "+l:l;return}
    pre.push(l);
  });
  o.type=pre.join("; ");
  o.pickup=pk.filter(Boolean).join(" + ");
  o.drop=dr.filter(function(x){return !/^\+?[\d\s]{8,}$/.test(x)}).join(" ");
  var ph=String(txt||"").match(/(\+?61[\d ]{9,13}|\b0[2-578][\d ]{8,11})/);
  if(ph)o.phone=ph[1].replace(/\s+$/,"");
  return o;
}
function parseEvent(e){
  var sub=String(e.subject||"").trim(), b=parseBody(e.summary);
  var j={id:e.id,key:String(e.id),subject:sub,webLink:e.webLink||"",body:b};
  var st=when(e.start),en=when(e.end);
  j.day=st.date;j.start=st.min;j.end=en.min+1440*dayDiff(st.date,en.date);
  if(j.end<=j.start)j.end=j.start+60;
  var pi=sub.search(/\(/),plat="",pidx=-1;
  PLAT.forEach(function(p){var m=sub.match(p[1]);if(m&&(pidx<0||m.index<pidx)){plat=p[0];pidx=m.index}});
  var cut=[pi,pidx].filter(function(x){return x>=0}).sort(function(a,b){return a-b})[0];
  j.customer=tc((cut==null?sub:sub.slice(0,cut)).replace(/\breturn\b/i,"").trim())||tc(sub);
  j.platform=plat;
  var rp=sub.match(/\(([^)]*)\)/);
  j.reps=rp?rp[1].split(/\band\b|,|&/i).map(tc).filter(Boolean):[];
  var sz=sub.match(/(\d+(?:\.\d+)?)\s*-?\s*(?:tonnes?|ton|t\b)/i);
  j.size=sz?sz[1]+"T":"";
  var mv=sub.match(/(\d)\s*(?:men|man|movers?)/i);j.movers=mv?+mv[1]:null;
  j.pending=/pending/i.test(sub);
  j.interstate=/inters?t?ate/i.test(sub);
  var hint=sub.match(/assigned to\s+([A-Za-z][A-Za-z .'-]*)/i);j.hint=hint?tc(hint[1].trim()):"";
  j.route=[shortLoc(b.pickup),shortLoc(b.drop)].filter(Boolean).join(" → ");
  return j;
}
function when(x){
  var dt=String((x&&x.dateTime)||""),tz=(x&&x.timeZone)||"UTC";
  if(/^utc$/i.test(tz)||/z$/i.test(dt))return melParts(new Date(dt.slice(0,19)+"Z"));
  return {date:dt.slice(0,10),min:(+dt.slice(11,13))*60+(+dt.slice(14,16))};
}

/* ---------- sign-in and Microsoft Graph ---------- */
var CFG=window.EAM_CONFIG||{},G="https://graph.microsoft.com/v1.0",NS="{b7c1f0a2-5d3e-4c8a-9f61-2e4d7a90c3b5}";
var P_JOB="String "+NS+" Name eamDispatchJob",P_FLEET="String "+NS+" Name eamDispatchFleet";
var BASE=CFG.mailbox?G+"/users/"+encodeURIComponent(CFG.mailbox):G+"/me";
var SCOPES=[CFG.mailbox?"Calendars.ReadWrite.Shared":"Calendars.ReadWrite"];
var REDIR=new URL("./",location.href).href.split(/[?#]/)[0];
var DEFAULT_FLEET={trucks:[{id:"t1",name:"Truck 1",size:""},{id:"t2",name:"Truck 2",size:""}],crew:[],buffer:30};
var pca=null,account=null,calId=null;
function expandQ(p){return encodeURIComponent("singleValueExtendedProperties($filter=id eq '"+p+"')")}
function token(){
  return pca.acquireTokenSilent({scopes:SCOPES,account:account}).then(function(r){return r.accessToken},function(e){
    var er=new Error("auth");er.status=401;throw er});
}
function gfetch(url,opt){
  opt=opt||{};
  return token().then(function(t){
    var h={Authorization:"Bearer "+t,Prefer:'outlook.timezone="'+TZ+'", outlook.body-content-type="text", IdType="ImmutableId"'};
    if(opt.body)h["Content-Type"]="application/json";
    return fetch(url,{method:opt.method||"GET",headers:h,body:opt.body?JSON.stringify(opt.body):undefined});
  }).then(function(r){
    if(r.ok)return r.status===204?null:r.json().catch(function(){return null});
    return r.text().then(function(t){var e=new Error("graph");e.status=r.status;try{e.detail=JSON.parse(t).error}catch(x){}throw e});
  });
}
function errText(e){
  var s=e&&e.status;
  if(s===401){S.auth="out";return "Your Microsoft sign-in has expired. Sign in again."}
  if(s===403)return "This Microsoft account isn't allowed to open the EAM calendar. Sign out and use the admin account.";
  if(s===404)return "The calendar wasn't found for this account.";
  if(s===429||s>=500)return "Outlook is busy just now. Press Refresh in a moment.";
  if(!s)return "No connection. Check the internet on this device, then press Refresh.";
  return "Outlook reported a problem ("+s+((e.detail&&e.detail.code)?", "+e.detail.code:"")+").";
}
function numOrNull(v){return (v===undefined||v===null||v===""||!isFinite(+v))?null:+v}
function readProp(o){var p=(o&&o.singleValueExtendedProperties)||[];if(!p.length||!p[0].value)return null;try{return JSON.parse(p[0].value)}catch(x){return null}}
function fetchWeek(ws,force,quiet){
  if(S.auth!=="in"||S.busy[ws])return Promise.resolve();
  S.busy[ws]=1;S.loading=true;if(!quiet){S.err=null;render()}
  var out=[];
  var url=BASE+"/calendarView?startDateTime="+addDays(ws,-1)+"T00:00:00&endDateTime="+addDays(ws,9)+"T00:00:00&$top=100&$orderby=start/dateTime&$select=id,subject,body,bodyPreview,start,end,isAllDay,isCancelled,webLink&$expand="+expandQ(P_JOB);
  function page(u,n){return gfetch(u).then(function(d){out=out.concat((d&&d.value)||[]);if(d&&d["@odata.nextLink"]&&n<10)return page(d["@odata.nextLink"],n+1)})}
  function done(){delete S.busy[ws];S.loading=Object.keys(S.busy).length>0}
  return page(url,0).then(function(){
    var jobs=absorbJobs(out);
    S.events[ws]=jobs;S.fetched[ws]=Date.now();S.err=null;done();render();
  },function(e){done();S.err=errText(e);render()});
}
function loadFleet(){
  return gfetch(BASE+"/calendar?$select=id,name").then(function(c){
    calId=c.id;return gfetch(BASE+"/calendars/"+encodeURIComponent(calId)+"?$select=id&$expand="+expandQ(P_FLEET));
  }).then(function(c){
    var d=readProp(c);
    S.fleet=d&&Array.isArray(d.trucks)?{trucks:d.trucks,crew:Array.isArray(d.crew)?d.crew:[],buffer:typeof d.buffer==="number"?d.buffer:30,weekHours:typeof d.weekHours==="number"?d.weekHours:60,defRate:typeof d.defRate==="number"?d.defRate:120}:JSON.parse(JSON.stringify(DEFAULT_FLEET));
    S.fleetLoaded=true;render();
  },function(e){S.fleetLoaded=true;S.fleet=JSON.parse(JSON.stringify(DEFAULT_FLEET));if(!S.err)S.err=errText(e);render()});
}
function pushFleet(f){
  if(!calId)return Promise.reject(new Error("no calendar"));
  return gfetch(BASE+"/calendars/"+encodeURIComponent(calId),{method:"PATCH",body:{singleValueExtendedProperties:[{id:P_FLEET,value:JSON.stringify(f)}]}});
}
function saveAssign(job,patch){
  var cur=S.assign[job.key]||{truck:"",crew:[],sub:"",nosub:false};
  function pk(f){return patch[f]!==undefined?patch[f]:cur[f]}
  var nx={truck:pk("truck"),crew:pk("crew"),sub:pk("sub")||"",nosub:!!pk("nosub"),day:job.day};
  ["t0","t1","cost","val"].forEach(function(f){nx[f]=numOrNull(pk(f))});
  var gone=!nx.truck&&!nx.crew.length&&!nx.sub&&!nx.nosub&&nx.t0==null&&nx.t1==null&&nx.cost==null&&nx.val==null;
  var a={};for(var k in S.assign)a[k]=S.assign[k];
  if(gone)delete a[job.key];else a[job.key]=nx;
  S.assign=a;render();
  pending[job.key]=(pending[job.key]||0)+1;
  var val=gone?"{}":JSON.stringify({truck:nx.truck,crew:nx.crew,sub:nx.sub,nosub:nx.nosub,t0:nx.t0,t1:nx.t1,cost:nx.cost,val:nx.val});
  writeChain[job.key]=(writeChain[job.key]||Promise.resolve()).then(function(){
    return gfetch(BASE+"/events/"+encodeURIComponent(job.id),{method:"PATCH",body:{singleValueExtendedProperties:[{id:P_JOB,value:val}]}});
  }).catch(function(e){toast("That change wasn't saved. "+errText(e));if(S.auth!=="in")render()}).then(function(){pending[job.key]--});
}
function signIn(){if(pca)pca.loginRedirect({scopes:SCOPES,prompt:"select_account"}).catch(function(){toast("Sign-in couldn't start. Try again.")})}
function signOut(){if(pca&&account)pca.logoutRedirect({account:account,postLogoutRedirectUri:REDIR}).catch(function(){})}
function boot(){
  if(!CFG.clientId){S.auth="setup";render();return}
  if(!window.msal||!msal.PublicClientApplication){S.auth="error";render();return}
  pca=new msal.PublicClientApplication({auth:{clientId:CFG.clientId,authority:"https://login.microsoftonline.com/"+(CFG.tenant||"organizations"),redirectUri:REDIR},cache:{cacheLocation:"localStorage"}});
  pca.initialize().then(function(){return pca.handleRedirectPromise()}).then(function(r){
    account=(r&&r.account)||pca.getAllAccounts()[0]||null;
    if(!account){S.auth="out";render();return}
    pca.setActiveAccount(account);S.auth="in";S.who=account.username||"";window.EAM.who=S.who;render();
    if(location.hash==="#quotes")setTab("quotes");else if(location.hash==="#numbers")setTab("numbers");
    loadFleet();fetchWeek(weekStart(S.day),false);
  }).catch(function(){S.auth="out";S.err="Sign-in didn't finish. Try again.";render()});
}

/* ---------- board maths ---------- */
function dayJobs(day){return (S.events[weekStart(day)]||[]).filter(function(j){return j.day===day}).sort(function(a,b){return a.start-b.start||a.end-b.end})}
function truckOf(j){var a=S.assign[j.key];if(!a||!a.truck)return "";return S.fleet.trucks.some(function(t){return t.id===a.truck})?a.truck:""}
function subOf(j){if(truckOf(j))return "";var a=S.assign[j.key];if(a){if(a.sub)return a.sub;if(a.nosub)return ""}return j.hint||""}
function needs(j){return !truckOf(j)&&!subOf(j)}
function subNames(){var o={};Object.keys(S.events).forEach(function(w){S.events[w].forEach(function(j){if(j.hint)o[j.hint]=1})});Object.keys(S.assign).forEach(function(k){if(S.assign[k].sub)o[S.assign[k].sub]=1});return Object.keys(o).sort()}
function crewOf(j){var a=S.assign[j.key];return a?a.crew.filter(function(c){return S.fleet.crew.some(function(x){return x.id===c})}):[]}
function overlap(a,b,buf){return a.start<b.end+buf&&b.start<a.end+buf}
function analyse(jobs){
  var buf=S.fleet.buffer||0,flags={};
  jobs.forEach(function(j){flags[j.key]={clash:[],tight:[],size:""}});
  for(var i=0;i<jobs.length;i++)for(var k=i+1;k<jobs.length;k++){
    var a=jobs[i],b=jobs[k];if(!overlap(a,b,buf))continue;
    var hard=overlap(a,b,0),ta=truckOf(a),tb=truckOf(b);
    if(ta&&ta===tb){var nm=truckName(ta);
      if(hard){flags[a.key].clash.push(nm+" is also on "+b.customer+" at "+tm(b.start));flags[b.key].clash.push(nm+" is also on "+a.customer+" at "+tm(a.start))}
      else{flags[a.key].tight.push("Under "+buf+" min before "+b.customer+" at "+tm(b.start));flags[b.key].tight.push("Under "+buf+" min after "+a.customer+" ends at "+tm(a.end))}}
    var cb=crewOf(b);crewOf(a).forEach(function(c){if(cb.indexOf(c)<0)return;var cn=crewName(c);
      if(hard){flags[a.key].clash.push(cn+" is also on "+b.customer+" at "+tm(b.start));flags[b.key].clash.push(cn+" is also on "+a.customer+" at "+tm(a.start))}});
  }
  jobs.forEach(function(j){var t=truckOf(j);if(!t||!j.size)return;var tr=S.fleet.trucks.filter(function(x){return x.id===t})[0];
    if(tr&&tr.size&&tr.size!=="Other"&&tr.size!==j.size)flags[j.key].size="Booked as "+j.size+", "+tr.name+" is "+tr.size});
  return flags;
}
function truckName(id){var t=S.fleet.trucks.filter(function(x){return x.id===id})[0];return t?t.name:"Truck"}
function crewName(id){var c=S.fleet.crew.filter(function(x){return x.id===id})[0];return c?c.name:"Crew"}
function stack(jobs){var rows=[];jobs.forEach(function(j){var r=0;while(rows[r]&&rows[r]>j.start)r++;rows[r]=j.end;j._row=r});return Math.max(1,rows.length)}

/* ---------- job times, prices and subcontractor costs ---------- */
function money(n){n=Math.round((+n||0)*100)/100;return (n<0?"-":"")+"$"+Math.abs(n).toLocaleString("en-AU",{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}

document.addEventListener("submit",function(e){
  var f=e.target;if(!f||["lockSet","lockOpen","lockChange"].indexOf(f.id)<0)return;

    var a=v("pw1"),b=v("pw2");

      return writeLock(a).then(function(){LOCK.busy=false;open()})}).catch(function(e){fail(e&&e.message==="nocrypto"?"This browser can’t set a password. Use Safari or Chrome.":"Couldn’t save the password. "+errText(e))});

    },function(e){fail(e&&e.message==="nocrypto"?"This browser can’t check the password. Use Safari or Chrome.":"Couldn’t check the password. "+errText(e))});
  }else{
    var c=v("pwc"),n1=v("pwn1"),n2=v("pwn2");
    if(n1.length<8)return lockSay("Use at least 8 characters for the new password.");
    if(n1!==n2)return lockSay("The new passwords don’t match.");
    LOCK.busy=true;lockSay("Saving…");
    testLock(c).then(function(ok){if(!ok)return fail("The current password is wrong.");
      return writeLock(n1).then(function(){LOCK.busy=false;S.modal=null;$("overlay").innerHTML="";toast("Partner password changed.")})}).catch(function(e){fail("Couldn’t change the password. "+errText(e))});
  }
});

var MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"],DAYL=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"],nTried={},NCH={};

function fetchSpan(ws0,n){

function fM0(n){return n==null||isNaN(n)?"–":(n<0?"-":"")+"$"+Math.round(Math.abs(n)).toLocaleString("en-AU")}
function fP(x,d){return x==null||isNaN(x)?"–":(x*100).toFixed(d==null?0:d)+"%"}
function fH(h){return h==null?"–":(Math.round(h*10)/10).toLocaleString("en-AU")}
function plural(n,w){return n+" "+w+(n===1?"":"s")}
function dlt(cur,prev,kind,goodUp){
  if(cur==null||prev==null||isNaN(cur)||isNaN(prev))return {t:"no comparison",c:"n"};
  var col=function(up){return goodUp==null?"n":(up===goodUp?"g":"b")};
  if(kind==="pts"){var d=(cur-prev)*100;if(Math.abs(d)<0.05)return {t:"no change",c:"n"};return {t:(d>0?"▲ ":"▼ ")+Math.abs(d).toFixed(1)+" pts",c:col(d>0)}}
  if(!prev)return cur?{t:"▲ up from 0",c:col(true)}:{t:"no change",c:"n"};
  var r=(cur-prev)/Math.abs(prev)*100;if(Math.abs(r)<0.5)return {t:"no change",c:"n"};
  return {t:(r>0?"▲ ":"▼ ")+Math.abs(r).toFixed(Math.abs(r)>=10?0:1)+"%",c:col(r>0)};
}
function chgTxt(cur,prev){if(!prev)return cur?"new":"–";var r=(cur-prev)/Math.abs(prev)*100;return Math.abs(r)<0.5?"0%":(r>0?"+":"−")+Math.abs(r).toFixed(0)+"%"}

function rightRound(x,y,w,h,r){r=Math.min(r,w,h/2);return "M"+x+","+y+"H"+(x+w-r)+"Q"+(x+w)+","+y+" "+(x+w)+","+(y+r)+"V"+(y+h-r)+"Q"+(x+w)+","+(y+h)+" "+(x+w-r)+","+(y+h)+"H"+x+"Z"}
function svgWrap(w,h,body,label){return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+esc(label||"")+'">'+body+'</svg>'}

function lineChart(w,cats,series,fmt,minTop,label){

function hbarChart(w,rows,fmt,label){

}

document.addEventListener("drop",function(e){var l=e.target.closest&&e.target.closest(".lane");if(!l||!dragKey)return;e.preventDefault();var j=findJob(dragKey);dragKey=null;var to=l.dataset.truck;if(!j){render();return}
  if(to.indexOf("sub:")===0){if(subOf(j)!==to.slice(4))saveAssign(j,{truck:"",sub:to.slice(4),nosub:false,crew:[]});else render()}
  else if(to===""){if(!needs(j))saveAssign(j,{truck:"",sub:"",nosub:!!j.hint});else render()}
  else if(truckOf(j)!==to)saveAssign(j,{truck:to,sub:"",nosub:false});else render()});
document.addEventListener("dragend",function(){dragKey=null;document.querySelectorAll(".lane.over").forEach(function(l){l.classList.remove("over")})});

/* ---------- sections: Dispatch and Quotes share one sign-in ---------- */
var TAB="dispatch";
function setTab(m){
  if(m!=="quotes"&&m!=="numbers")m="dispatch";
  TAB=m;document.body.classList.toggle("quotes",m==="quotes");document.body.classList.toggle("numbers",m==="numbers");
  [["tabDispatch","dispatch"],["tabQuotes","quotes"],["tabNumbers","numbers"]].forEach(function(x){if(x[1]===m)$(x[0]).setAttribute("aria-current","page");else $(x[0]).removeAttribute("aria-current")});
  $("appTitle").textContent=m==="quotes"?"EAM Quote Builder":m==="numbers"?"EAM Numbers":"EAM Dispatch Board";
  if(m==="quotes"&&S.auth==="in"){var f=$("qframe");if(!f.getAttribute("src"))f.setAttribute("src","quotes.html")}
  try{var want=m==="dispatch"?"":"#"+m;if(location.hash!==want)history.replaceState(null,"",want||location.pathname+location.search)}catch(e){}
  S.sel=null;nTried={};
  if(m==="dispatch"&&S.auth==="in")fetchWeek(weekStart(S.day),true,true);
  render();
}
window.EAM={gfetch:gfetch,BASE:BASE,TZ:TZ,who:"",refreshBoard:function(){var ws=weekStart(S.day);delete S.busy[ws];fetchWeek(ws,true,true)},
  /* which of our trucks are free for a window on a day; used by the Quotes section */
  availability:function(day,start,end){
    var ws=weekStart(day),p=S.events[ws]?Promise.resolve():fetchWeek(ws,false,true);
    return Promise.resolve(p).then(function(){
      if(!S.events[ws]){var e=new Error("loading");e.code="loading";throw e}
      var jobs=dayJobs(day),q={start:start,end:end},buf=S.fleet.buffer||0;
      return {trucks:S.fleet.trucks.map(function(t){var hit=jobs.filter(function(j){return truckOf(j)===t.id&&overlap(j,q,buf)})[0];return {name:t.name,size:t.size||"",free:!hit,busy:hit?tm(hit.start)+" to "+tm(hit.end)+" "+hit.customer:""}}),
        waiting:jobs.filter(function(j){return needs(j)&&overlap(j,q,buf)}).length,jobs:jobs.length};
    });
  }};
/* ---------- iPhone home-screen app: keep content below the status bar ---------- */
function fixTopGap(){
  try{
    var root=document.documentElement,ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
    var standalone=navigator.standalone===true||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches);
    var pr=document.createElement("div");pr.style.cssText="position:fixed;top:0;left:0;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";document.body.appendChild(pr);
    var envTop=parseFloat(getComputedStyle(pr).paddingTop)||0;pr.remove();
    var portrait=innerHeight>innerWidth,underBar=Math.abs(screen.height-innerHeight)<20||Math.abs(screen.width-innerHeight)<20;
    if(ios&&standalone&&portrait&&envTop<20&&underBar)root.style.setProperty("--sat","56px");else root.style.removeProperty("--sat");
  }catch(e){}
}
fixTopGap();window.addEventListener("resize",fixTopGap);window.addEventListener("orientationchange",function(){setTimeout(fixTopGap,300)});
