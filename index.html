<style>

  color-scheme:light;
}
@media (prefers-color-scheme: dark){

    --navy:#0a2f66; --royal:#5aa2ff; --sky:#38B6FF; --accent-ink:#06162e;
    --job:#17305a; --job-line:#5aa2ff; --job-ink:#dbe9ff;
    --warn:#f3b24a; --warn-bg:#3a2a0c; --bad:#ff8a80; --bad-bg:#3d1616; --ok:#6ed39b; --ok-bg:#12301f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1320; --panel:#141d2d; --ink:#e8eef8; --muted:#9aa8bd; --line:#2a364a; --grid:#1e293b;
  --navy:#0a2f66; --royal:#5aa2ff; --sky:#38B6FF; --accent-ink:#06162e;
  --job:#17305a; --job-line:#5aa2ff; --job-ink:#dbe9ff;
  --warn:#f3b24a; --warn-bg:#3a2a0c; --bad:#ff8a80; --bad-bg:#3d1616; --ok:#6ed39b; --ok-bg:#12301f;
  color-scheme:dark;
}
html{--sat:env(safe-area-inset-top,0px)}
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;--s6:#008300;--s7:#6250d6;--s8:#e34948;--spark:#9aa6b8;--trk:#cde2fb;--q1:#cde2fb;--q2:#9ec5f4;--q3:#6da7ec;--q4:#3987e5;--q5:#256abf;--q6:#104281}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--spark:#5d6b80;--trk:#184f95;--q1:#123a6e;--q2:#184f95;--q3:#256abf;--q4:#3987e5;--q5:#6da7ec;--q6:#9ec5f4}}
:root[data-theme="dark"]{--s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;--s6:#0ca30c;--s7:#9085e9;--s8:#e66767;--spark:#5d6b80;--trk:#184f95;--q1:#123a6e;--q2:#184f95;--q3:#256abf;--q4:#3987e5;--q5:#6da7ec;--q6:#9ec5f4}
*{box-sizing:border-box}
html,body{margin:0}

.pj span{font-size:11.5px;color:var(--muted)}
.plink{font-size:11.5px;color:var(--muted);white-space:nowrap}.plink::before{content:"\2192  "}.plink.w{color:var(--warn);font-weight:700}.plink.b{color:var(--bad);font-weight:700}
.pissues{font-size:13px;background:var(--warn-bg);color:var(--ink);border-radius:8px;padding:8px 12px}.pissues ul{margin:4px 0 0;padding-left:18px}
.pacts{display:flex;flex-wrap:wrap;gap:8px}
.pblock{font-size:13px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:flex;flex-direction:column;gap:6px}.pblock p{margin:0}.pblock ul{margin:0;padding-left:18px}.pblock li+li{margin-top:3px}.pblock.w{background:var(--warn-bg);border-color:transparent}.pblock.g{background:var(--ok-bg);border-color:transparent}
@media (max-width:600px){.prun{grid-template-columns:1fr}}
.oos{margin-top:6px;align-self:flex-start;font:inherit;font-size:11.5px;font-weight:700;border:1px solid var(--line);background:var(--card,transparent);color:var(--muted);border-radius:6px;padding:3px 8px;cursor:pointer}
.oos:hover{color:var(--ink);border-color:var(--muted)}
.oos[aria-pressed="true"]{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.lab .oos{display:block}
.lane.off{background:repeating-linear-gradient(135deg,var(--grid) 0 8px,transparent 8px 16px)}
.offmsg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.3px;pointer-events:none;white-space:nowrap}
.offrow .lab .nm{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--muted)}
.sec.offsec{opacity:.9}.sec.offsec h4 span{text-decoration:line-through;color:var(--muted)}.sec .oos{margin:0 0 8px}
body.changes .daybar,body.changes .week,body.changes .stats,body.changes .board,body.changes .legend,body.changes #btnSheet{display:none}
#changes .nbar .sp{flex:1}
#changes .note{margin:0;font-size:12px;color:var(--muted);max-width:100ch}
.cday{font-size:13px;margin:14px 0 6px;color:var(--muted)}.cday:first-child{margin-top:0}
.clist{display:flex;flex-direction:column;gap:6px}
.chg{display:grid;grid-template-columns:118px 1fr auto;gap:10px;align-items:start;border:1px solid var(--line);border-left:4px solid var(--royal);border-radius:9px;padding:9px 12px}
.chg.deleted,.chg.cancelled{border-left-color:var(--bad)}.chg.reset{border-left-color:var(--muted)}
.cbadge{justify-self:start;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;background:var(--job);color:var(--royal)}

.cmain{display:flex;flex-direction:column;gap:3px;min-width:0;font-size:13.5px}.cmain .cs{overflow-wrap:anywhere}.cmain s{color:var(--muted)}
.ctag{align-self:flex-start;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--grid);color:var(--muted)}.ctag.w{background:var(--warn-bg);color:var(--warn)}
.cwhen{text-align:right;display:flex;flex-direction:column;font-size:13px}.cwhen small{color:var(--muted);font-size:11px}
@media (max-width:600px){.chg{grid-template-columns:1fr auto}.chg .cbadge{grid-column:1;grid-row:1}.chg .cwhen{grid-column:2;grid-row:1}.chg .cmain{grid-column:1/-1;grid-row:2}}
body.gated #sales{display:none}
#sales{display:flex;flex-direction:column;gap:14px}
body.sales .daybar,body.sales .week,body.sales .stats,body.sales .board,body.sales .legend,body.sales #btnSheet{display:none}
.reps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.rep{display:flex;flex-direction:column;gap:8px}
.rh{display:flex;align-items:center;gap:10px}.rh h3{margin:0;flex:1;font-size:17px}
.rk{font-weight:800;color:var(--muted);font-size:13px}
.pc{font-weight:800;font-size:18px}.pc.g{color:var(--ok)}.pc.i{color:var(--royal)}.pc.b{color:var(--warn)}
.rnum{font-size:14px;color:var(--muted)}.rnum b{font-size:22px;color:var(--ink)}.rnum .d{font-size:12px;font-weight:700;margin-left:6px}.rnum .d.g{color:var(--ok)}.rnum .d.b{color:var(--bad)}.rnum .d.n{color:var(--muted)}
.rstats{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.ins.sm li{font-size:13px}
.srcs{display:flex;flex-direction:column;gap:10px;margin:4px 0 6px}
.srow{display:grid;grid-template-columns:minmax(60px,110px) 1fr auto;gap:10px;align-items:center;font-size:13px}
.srow .sn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.srow .st{color:var(--muted);font-variant-numeric:tabular-nums}
.sbar{display:flex;gap:2px;height:10px}.sbar i{display:block;flex-basis:0;min-width:3px;height:100%}
.sbar i:first-child{border-radius:5px 0 0 5px}.sbar i:last-child{border-radius:0 5px 5px 0}.sbar i:only-child{border-radius:5px}
.muted{color:var(--muted);font-size:.88em}
.shouts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:12px}
.shout{display:flex;gap:14px;align-items:flex-start;background:var(--sb);border-left:4px solid var(--sc);border-radius:10px;padding:14px 16px;color:#1d2430}

.krc{font-weight:800;border-radius:5px;padding:1px 6px;white-space:nowrap;font-size:12.5px}.krc.g{background:var(--ok-bg,#e3f5ea);color:var(--ok)}.krc.b{background:var(--bad-bg);color:var(--bad)}.krc.w{background:var(--warn-bg);color:var(--warn)}.krc.n{background:var(--grid);color:var(--muted);font-weight:600}
.krin input{width:90px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel);color:var(--ink)}.krin td,.krin th{padding:6px 8px;text-align:left}
.krset{display:flex;flex-wrap:wrap;gap:10px}.krset label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:700;color:var(--muted)}.krset input{width:110px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:7px}

.npanel td .spark{width:90px;height:22px;margin:0 0 0 16px}
ul.plain{margin:0;padding-left:18px;display:grid;gap:5px;font-size:14px;line-height:1.5}
.rep .cmt{margin:0;font-size:14px;line-height:1.55}

.sgrid td,.sgrid th{white-space:nowrap}
.sgrid tfoot td{border-top:1px solid var(--line)}
.cellb{border:1px solid transparent;border-radius:7px;padding:4px 8px;min-width:58px;font-weight:700;font-variant-numeric:tabular-nums;background:transparent;text-align:right}
.cellb.hit{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}

.offg td,.offg th{text-align:center;padding:4px 6px}.offg td:first-child,.offg th:first-child{text-align:left}
body.gated #numbers{display:none}
body.numbers .daybar,body.numbers .week,body.numbers .stats,body.numbers .board,body.numbers .legend,body.numbers #btnSheet{display:none}

function parseBody(txt){

function parseEvent(e){

    var a=jobs[i],b=jobs[k];if(!overlap(a,b,buf))continue;

    if(ta&&ta===tb){var nm=truckName(ta);
      if(hard){flags[a.key].clash.push(nm+" is also on "+b.customer+" at "+tm(b.start));flags[b.key].clash.push(nm+" is also on "+a.customer+" at "+tm(a.start))}
      else{flags[a.key].tight.push("Under "+buf+" min before "+b.customer+" at "+tm(b.start));flags[b.key].tight.push("Under "+buf+" min after "+a.customer+" ends at "+tm(a.end))}}

      if(hard){flags[a.key].clash.push(cn+" is also on "+b.customer+" at "+tm(b.start));flags[b.key].clash.push(cn+" is also on "+a.customer+" at "+tm(a.start))}});

/* --- turn the workbook into shifts and jobs --- */
function finLev(a,b){var m=a.length,n=b.length,d=[],i,j;for(i=0;i<=m;i++){d[i]=[i]}for(j=0;j<=n;j++)d[0][j]=j;

/* rates written in a note: "2.67 Hours @ 8 Ton Rate 2 Hours @ 4.5 Ton Rate", "2.5 Hour 4.5 Rate 4.5 Hours 8 Ton Rate",
   "8 Ton Rate at 155 Per hour Plus 120$ for Call Out", "$40/hr" */
function finNoteRates(t){
  t=String(t||"");var out={h8:0,h45:0,sp:0,co:0,found:false},m,re=/(\d+(?:\.\d+)?)\s*(?:hours?|hrs?)\.?\s*(?:@|at)?\s*(4\.5|8)\s*(?:tonnes?|tons?|t)?\s*rate/gi;
  while((m=re.exec(t))){if(m[2]==="8")out.h8+=+m[1];else out.h45+=+m[1];out.found=true}
  m=t.match(/\$?\s*(\d+(?:\.\d+)?)\s*\$?\s*(?:\/\s*h(?:ou)?rs?\b|per\s*h(?:ou)?rs?\b)/i);if(m){out.sp=+m[1];out.found=true}

function finDate(v){

  if(ST){for(var i=9;i<=16;i++){var a=finTxt(cell("A"+i)),b=finTxt(cell("B"+i));if(a&&b)alias[a]=b}

    else{rates[n].r8=rates[n].r45;issues.push("The file has no 8T rate for "+n+", so the 4.5T rate is used for his 8T hours.")}});

  var known=Object.keys(pay).concat(Object.keys(rates)),fuzzy={},fuzzyNoted={};

    if(fuzzy[x]===undefined){var lx=x.toLowerCase(),hit=known.filter(function(k){var lk=k.toLowerCase();return lk===lx||(lk[0]===lx[0]&&Math.min(lk.length,lx.length)>=4&&finLev(lk,lx)<=2)});

/* ---------- Pairing advice and run sheet (the "Removalist daily schedule" rules, inside Dispatch) ----------
   Rules (from the daily schedule task):
   - Each morning job (start before 12pm) starts a truck; afternoon jobs follow on a truck that can reach them in time.
   - Crew: a later job can't need more movers than the truck's first job (3-man then 4-man is not allowed;
     4-man then 3-man is fine, 3 then 3 is best). No crew size stated = fits any truck.
   - Geography: pair jobs that are close; avoid east then west on one truck.
   - A truck's size must fit the job (an 8T job can't go on a 4.5T truck) when both sizes are known.
   Locations come from the suburb or postcode in each address (geo-vic.js, public data), so travel is an estimate. */
var PAIR={loading:false,sig:{},open:true};
var DEPOT_SUBURB="THOMASTOWN";
function needGeo(){
  if(window.EAM_GEO)return true;
  if(!PAIR.loading){PAIR.loading=true;var s=document.createElement("script");s.src="geo-vic.js";s.onload=function(){render()};s.onerror=function(){PAIR.loading=false};document.head.appendChild(s)}
  return false;
}
var GEO_CACHE={};
function geoOf(addr){
  if(!addr||!window.EAM_GEO)return null;
  if(GEO_CACHE[addr]!==undefined)return GEO_CACHE[addr];
  var G=window.EAM_GEO,A=String(addr).toUpperCase().replace(/[^A-Z0-9' ,-]/g," "),res=null;
  var pcm=A.match(/\b(3\d{3})\b(?!.*\b3\d{3}\b)/),pc=pcm?pcm[1]:"";
  var segs=A.split(",").map(function(s){return s.trim()}).filter(Boolean);
  var clean=function(s){return s.replace(/\b(AUSTRALIA|VICTORIA|VIC)\b/g," ").replace(/\b\d{4}\b/g," ").replace(/\s+/g," ").trim()};
  /* the suburb is usually the last words before VIC / the postcode */
  for(var i=segs.length-1;i>=0&&!res;i--){
    var w=clean(segs[i]).split(" ").filter(Boolean);
    for(var n=Math.min(4,w.length);n>=1&&!res;n--){var nm=w.slice(w.length-n).join(" ");if(G.s[nm])res={lat:G.s[nm][0],lon:G.s[nm][1],name:tc(nm.toLowerCase())}}
  }
  if(!res&&pc&&G.p[pc])res={lat:G.p[pc][0],lon:G.p[pc][1],name:pc};
  GEO_CACHE[addr]=res;return res;
}
function firstAddr(a){return String(a||"").split(" + ")[0]}
function lastAddr(a){var p=String(a||"").split(" + ");return p[p.length-1]}
function jobGeo(j){
  if(j._g)return j._g;
  var b=j.body,p=geoOf(firstAddr(b.pickup)),d=geoOf(lastAddr(b.drop))||(b.drop?null:p);
  return (j._g={p:p,d:d});
}
function travelMin(a,b){
  if(!a||!b)return null;
  var R=6371,t=Math.PI/180,dLa=(b.lat-a.lat)*t,dLo=(b.lon-a.lon)*t,x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*t)*Math.cos(b.lat*t)*Math.sin(dLo/2)*Math.sin(dLo/2);
  var km=2*R*Math.asin(Math.sqrt(x))*1.35;   /* straight line x 1.35 = rough road distance */
